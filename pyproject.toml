[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "manimlite"
version = "0.1.0a0"
description = "Unofficial lightweight animation engine inspired by ManimCE — built for speed and LLM code generation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Nabin Oli" }]
keywords = ["animation", "education", "video", "manim", "skia"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "av>=12.0",
    "ipython>=9.13.0",
    "numpy>=1.26",
    "pydub>=0.25.1",
    "pygments>=2.17",
    "skia-python>=120.0",
    "typer>=0.12",
]

[project.optional-dependencies]
tts = [
    # Kitten TTS — Apache-2.0; wheel from upstream releases (see ADR-0004)
    "kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl",
    "soundfile>=0.12",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
manimlite = "manimlite.cli:app"

[project.urls]
Homepage = "https://github.com/nabin2004/ManimLite"
Documentation = "https://github.com/nabin2004/ManimLite/tree/main/docs"
Repository = "https://github.com/nabin2004/ManimLite"
Issues = "https://github.com/nabin2004/ManimLite/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/manimlite"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
packages = ["manimlite"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["skia", "skia.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

