[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "motiongram"
version = "0.4.0"
description = "Lightweight motion graphics for explainers — Typst math, Skia rendering, PyAV MP4 export, built for speed and LLM-friendly scene code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Nabin Oli" }]
keywords = ["animation", "education", "video", "skia", "typst", "motion-graphics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "av>=12.0",
    "ipython>=9.13.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pydub>=0.25.1",
    "pygments>=2.17",
    "pyyaml>=6.0",
    "skia-python>=120.0",
    "typer>=0.12",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
motiongram = "motiongram.cli:app"

[project.urls]
Homepage = "https://github.com/nabin2004/MotionGram"
Documentation = "https://github.com/nabin2004/MotionGram/tree/main/docs"
Repository = "https://github.com/nabin2004/MotionGram"
Issues = "https://github.com/nabin2004/MotionGram/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/motiongram"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"examples/principles/*.py" = ["E402", "E501", "F401"]
"src/motiongram/manifest/registry.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
packages = ["motiongram"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["skia", "skia.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pygments", "pygments.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

